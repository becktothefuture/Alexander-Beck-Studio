          - heading "Profile" [level=2] [ref=f14e15]
          - paragraph [ref=f14e16]: I’m a creative designer, technologist and systems thinker based in London. At Critical Mass, I work on digital experiences for the American Heart Association.
          - paragraph [ref=f14e17]: Teams bring me in to solve complexity, connect ambitious ideas to practical execution, and turn research, user needs and business ambition into purposeful, surprising work.
      - region [ref=f14e18]:
