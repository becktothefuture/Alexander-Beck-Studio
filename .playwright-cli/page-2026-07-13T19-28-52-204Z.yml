            - paragraph [ref=f17e10]: 01 — Present
            - heading "I help organisations shape complex ideas into clear, human and emotionally compelling experiences—especially when the answer is still being figured out." [level=1] [ref=f17e11]
        - region [ref=f17e12]:
          - generic [ref=f17e13]:
            - paragraph [ref=f17e14]: 02 — Profile
            - heading "Profile" [level=2] [ref=f17e15]
            - paragraph [ref=f17e16]: I’m a creative designer, technologist and systems thinker based in London. At Critical Mass, I work on digital experiences for the American Heart Association.
            - paragraph [ref=f17e17]: Teams bring me in to solve complexity, connect ambitious ideas to practical execution, and turn research, user needs and business ambition into purposeful, surprising work.
        - region [ref=f17e18]:
          - generic [ref=f17e20]:
            - paragraph [ref=f17e21]: 03 — Perspective
            - 'heading "The whole experience matters: how it works, how it looks, and how it makes people feel." [level=2] [ref=f17e22]'
        - region [ref=f17e23]:
          - generic [ref=f17e24]:
            - paragraph [ref=f17e25]: 04 — Trajectory
            - heading "Trajectory" [level=2] [ref=f17e26]
            - paragraph [ref=f17e27]: My path moved from language, technology and visual communication into interaction, behaviour and trust, then into products, brands and systems in implementation. Denaline, Yoti and MRM are the main turns; education stays a quiet footnote.
        - region [ref=f17e28]:
          - generic [ref=f17e30]:
            - paragraph [ref=f17e31]: 05 — From ambition to reality
            - heading "From ambition to reality, I help teams find the organising idea, make it tangible and protect what matters through delivery." [level=2] [ref=f17e32]
