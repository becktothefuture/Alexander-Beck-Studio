          - heading "Trajectory" [level=2] [ref=f3e26]
          - paragraph [ref=f3e27]: My path moved from language, technology and visual communication into interaction, behaviour and trust, then into products, brands and systems in implementation. Denaline, Yoti and MRM are the main turns; education stays a quiet footnote.
