          - heading "Profile" [level=2] [ref=f3e15]
          - paragraph [ref=f3e16]: I’m a creative designer, technologist and systems thinker based in London. At Critical Mass, I work on digital experiences for the American Heart Association.
          - paragraph [ref=f3e17]: Teams bring me in to solve complexity, connect ambitious ideas to practical execution, and turn research, user needs and business ambition into purposeful, surprising work.
