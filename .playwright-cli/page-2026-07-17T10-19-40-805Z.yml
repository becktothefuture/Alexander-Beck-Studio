                - strong [ref=f3e52]: different way of thinking
                - text: to the work.
              - paragraph [ref=f3e53]: Their different perspectives help me understand an opportunity, shape how an experience works, give it character, make behaviour and feeling tangible, and explore directly through code, tools and working systems.
              - paragraph [ref=f3e54]: AI runs through all of this as a creative material and a practical capability, expanding what I can explore, generate and build.
