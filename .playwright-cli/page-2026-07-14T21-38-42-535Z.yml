              - heading "Making ideas tangible" [level=2] [ref=e86]
              - paragraph [ref=e87]: The work often begins before the format is known. I immerse myself in the problem, look for the organising idea, and make it tangible enough for people to test together. Prototypes turn opinions into something we can experience. Systems help the idea travel.
              - paragraph [ref=e88]: Character is not decoration added after the useful work. It lives in how something responds, how movement guides attention, how a constraint becomes a useful choice, and how a person can sense that somebody cared.
              - paragraph [ref=e89]: The aim is not less complexity. It is more meaning, made legible.
              - paragraph [ref=e90]: The contexts change—from healthcare and identity to finance, mobility and culture—but the work repeatedly moves from an unresolved question towards something people can see, test and shape together.
