<!doctype html><html><meta charset="utf-8"><title>Home material reference</title><style>body{font:16px Arial;background:#181818;color:white;padding:32px}section{padding:24px;margin:24px 0}canvas{max-width:100%}a{display:inline-block;padding:15px;color:inherit}pre{white-space:pre-wrap}</style><h1>Shared Home circle material</h1><p>Actual shared generator at 8, 16, 32 and 64px.</p><div id="proof"></div><pre id="identity">Loading</pre><script type="module">
const design = await fetch('/config/design-system.json').then(response => response.json());
import {getSimulationBodyMaterialAtlas,drawSimulationBodyMaterial,setSimulationBodyMaterialConfig,scheduleSimulationBodyLighting} from '/src/legacy/modules/rendering/materials/simulation-body-material.js';
import {getSimulationPaletteSnapshot} from '/src/palette/simulationPaletteController.js';
import {resolveAboutSurfelPaletteColors} from '/src/routes/about-narrative-lab/aboutSurfelPalette.js';
setSimulationBodyMaterialConfig(design.shell.surface.simulationBodyMaterial);scheduleSimulationBodyLighting(design.shell.surface.lighting);
setTimeout(()=>{const snapshot=getSimulationPaletteSnapshot(),colors=resolveAboutSurfelPaletteColors(snapshot);const identity={palette:snapshot.paletteId,period:snapshot.periodId,colors,atlases:{}};for(const theme of ['dark','light']){const s=document.createElement('section');s.style.background=theme==='dark'?'#151515':'#f3f3f3';s.style.color=theme==='dark'?'white':'black';const h=document.createElement('h2');h.textContent=theme;s.append(h);const c=document.createElement('canvas');c.width=1024;c.height=320;const ctx=c.getContext('2d');colors.forEach((color,i)=>[8,16,32,64].forEach((size,j)=>drawSimulationBodyMaterial(ctx,color,60+i*164,35+j*76,size/2,{theme})));s.append(c);const atlas=getSimulationBodyMaterialAtlas(colors,{theme});const a=document.createElement('a');a.href=atlas.canvas.toDataURL('image/png');a.download='about-reset-home-atlas-'+theme+'.png';a.textContent='Download '+theme+' atlas';a.id='atlas-'+theme;s.append(a);identity.atlases[theme]={width:atlas.widthPx,height:atlas.heightPx,slots:atlas.slotCount,slotMap:colors.map(x=>atlas.getSlot(x)),detail:atlas.detailPx,gutter:atlas.gutterPx};document.getElementById('proof').append(s)}document.getElementById('identity').textContent=JSON.stringify(identity,null,2)},200);
</script></html>
