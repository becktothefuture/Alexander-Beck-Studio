<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="night-bloom-title night-bloom-desc">
  <title id="night-bloom-title">Night Bloom</title>
  <desc id="night-bloom-desc">A layered blue, purple, and yellow bloom opens from a dark square field.</desc>
