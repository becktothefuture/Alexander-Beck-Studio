    <linearGradient id="red-current-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff9ef"/>
      <stop offset="1" stop-color="#dfd7cb"/>
    </linearGradient>
    <linearGradient id="red-current-flow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ff745d"/>
      <stop offset="1" stop-color="#cf3150"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="640" fill="url(#red-current-bg)"/>
  <path d="M182 390c210-222 354-240 584-94 238 151 404 118 652-88" fill="none" stroke="url(#red-current-flow)" stroke-width="146" stroke-linecap="round"/>
