<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="twin-suns-title twin-suns-desc">
  <title id="twin-suns-title">Twin Suns</title>
  <desc id="twin-suns-desc">A red sun and a yellow sun sit on opposite sides of a blue horizontal band.</desc>
  <defs>
    <linearGradient id="twin-suns-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f6f0e5"/>
      <stop offset="1" stop-color="#ddd5c8"/>
    </linearGradient>
    <linearGradient id="twin-suns-band" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#245ca8"/>
      <stop offset="1" stop-color="#79b4e3"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="900" fill="url(#twin-suns-bg)"/>
  <rect y="350" width="1400" height="200" fill="url(#twin-suns-band)"/>
  <circle cx="386" cy="450" r="246" fill="#f25750"/>
  <circle cx="1042" cy="450" r="182" fill="#ffda4f"/>
  <circle cx="1042" cy="450" r="72" fill="#171717"/>
</svg>
