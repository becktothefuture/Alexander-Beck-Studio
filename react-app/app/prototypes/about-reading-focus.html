<!doctype html>
<!--
  Throwaway Wayfinder prototype. Three reading-focus variants, switchable via
  ?variant=, on the real local About route. Excluded from production inputs.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Prototype — About reading focus</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      .prototype-frame {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #000;
      }

      .prototype-switcher {
        position: fixed;
        right: 50%;
        bottom: 5.75rem;
        z-index: 100;
        display: grid;
        grid-template-columns: 2.75rem minmax(14rem, auto) 2.75rem;
        align-items: center;
        overflow: hidden;
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 999px;
        background: rgb(12 12 12 / 94%);
        box-shadow: 0 12px 38px rgb(0 0 0 / 38%);
        color: #fff;
        transform: translateX(50%);
        backdrop-filter: blur(18px);
      }

      .prototype-switcher button {
        display: grid;
        place-items: center;
        width: 2.75rem;
        height: 2.75rem;
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }

      .prototype-switcher button:hover,
      .prototype-switcher button:focus-visible {
        background: rgb(255 255 255 / 12%);
        outline: 0;
      }

      .prototype-switcher__label {
        display: grid;
        gap: 0.12rem;
        padding: 0.5rem 1rem 0.48rem;
        border-inline: 1px solid rgb(255 255 255 / 12%);
        text-align: center;
      }

      .prototype-switcher__label small {
        color: rgb(255 255 255 / 52%);
        font-size: 0.58rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        line-height: 1;
        text-transform: uppercase;
      }

      .prototype-switcher__label strong {
        font-size: 0.78rem;
        font-weight: 650;
        letter-spacing: 0.01em;
        line-height: 1.2;
      }

      .prototype-blocked {
        display: none;
        place-items: center;
        height: 100%;
        padding: 2rem;
        color: #fff;
        text-align: center;
      }

      @media (max-width: 600px) {
        .prototype-switcher {
          bottom: 4.8rem;
          grid-template-columns: 2.5rem minmax(12rem, auto) 2.5rem;
        }

        .prototype-switcher button {
          width: 2.5rem;
          height: 2.5rem;
        }
      }
    </style>
  </head>
  <body>
    <iframe
      class="prototype-frame"
      id="about-prototype-frame"
      title="About reading focus prototype"
    ></iframe>

    <nav class="prototype-switcher" aria-label="Prototype variants">
      <button id="prototype-previous" type="button" aria-label="Previous variant">←</button>
      <span class="prototype-switcher__label">
        <small id="prototype-meta">Word stream · current timing</small>
        <strong id="prototype-label">A — Current karaoke</strong>
      </span>
      <button id="prototype-next" type="button" aria-label="Next variant">→</button>
    </nav>

    <p class="prototype-blocked" id="prototype-blocked">
      This throwaway comparison is available only on the local development site.
    </p>

    <script>
      const VARIANTS = [
        { key: 'A', name: 'Current karaoke', meta: 'Word stream · current timing' },
        { key: 'B', name: 'Line baton', meta: 'Whole lines · 100 / 40 / 4' },
        { key: 'C', name: 'Clause spotlight', meta: 'Clauses · 100 / 42 / 4' },
      ];
      const EMPHASIS_PHRASES = [
        'People had to trust it.',
        'A rough prototype can create better conversations',
        'strengthens human judgement',
      ];
      const frame = document.querySelector('#about-prototype-frame');
      const label = document.querySelector('#prototype-label');
      const meta = document.querySelector('#prototype-meta');
      const previous = document.querySelector('#prototype-previous');
      const next = document.querySelector('#prototype-next');
      const switcher = document.querySelector('.prototype-switcher');
      const blocked = document.querySelector('#prototype-blocked');
      const localHosts = new Set(['localhost', '127.0.0.1']);
      const prototypeParams = new URLSearchParams(window.location.search);
      let focusFrame = 0;

      function clamp01(value) {
        return Math.min(1, Math.max(0, Number(value) || 0));
      }

      function smoothstep(start, end, value) {
        const progress = clamp01((value - start) / Math.max(0.0001, end - start));
        return progress * progress * (3 - (2 * progress));
      }

      function mix(start, end, progress) {
        return start + ((end - start) * clamp01(progress));
      }

      function readVariant() {
        const requested = new URL(window.location.href).searchParams.get('variant')?.toUpperCase();
        return VARIANTS.find((variant) => variant.key === requested) || VARIANTS[0];
      }

      function readMotionMode() {
        return new URL(window.location.href).searchParams.get('motion') === 'reduced'
          ? 'reduced'
          : 'full';
      }

      function updateSwitcher(variant) {
        label.textContent = `${variant.key} — ${variant.name}`;
        meta.textContent = `${variant.meta}${readMotionMode() === 'reduced' ? ' · reduced' : ''}`;
      }

      function setVariant(key) {
        const variant = VARIANTS.find((candidate) => candidate.key === key) || VARIANTS[0];
        const url = new URL(window.location.href);
        url.searchParams.set('variant', variant.key);
        window.history.replaceState({}, '', url);
        updateSwitcher(variant);
        applyVariant();
      }

      function cycleVariant(direction) {
        const current = readVariant();
        const currentIndex = VARIANTS.findIndex((variant) => variant.key === current.key);
        const nextIndex = (currentIndex + direction + VARIANTS.length) % VARIANTS.length;
        setVariant(VARIANTS[nextIndex].key);
      }

      function handleArrowKey(event) {
        const tagName = event.target?.tagName?.toLowerCase();
        if (tagName === 'input' || tagName === 'textarea' || event.target?.isContentEditable) return;
        if (event.key === 'ArrowLeft') {
          event.preventDefault();
          cycleVariant(-1);
        } else if (event.key === 'ArrowRight') {
          event.preventDefault();
          cycleVariant(1);
        }
      }

      function getSourceProgress(node) {
        return clamp01(Number.parseFloat(node.style.getPropertyValue('--editorial-reveal')));
      }

      function getWordNodes(node) {
        return Array.from(node.querySelectorAll('[data-editorial-reveal="word"]'));
      }

      function getRevealNodes(node) {
        return [
          ...(node.matches('[data-editorial-reveal]') ? [node] : []),
          ...node.querySelectorAll('[data-editorial-reveal]'),
        ];
      }

      function averageProgress(nodes) {
        if (!nodes.length) return 0;
        return nodes.reduce((sum, node) => sum + getSourceProgress(node), 0) / nodes.length;
      }

      function maximumProgress(nodes) {
        return nodes.reduce((maximum, node) => Math.max(maximum, getSourceProgress(node)), 0);
      }

      function getModules(stack) {
        return Array.from(stack.children).filter((node) => (
          node.matches('.about-narrative-editorial-copy, .about-narrative-editorial-list, .about-narrative-client-field, .about-interactive-stack, .about-narrative-media-deck')
        ));
      }

      function setWordOpacity(words, opacity, revealedEmphasis = false) {
        const value = clamp01(opacity).toFixed(4);
        words.forEach((word) => {
          word.style.setProperty('--prototype-focus-opacity', value);
          if (word.matches('[data-prototype-emphasis]')) {
            word.style.setProperty(
              '--prototype-emphasis-opacity',
              revealedEmphasis ? '1' : Number(value) <= 0.0401 ? '0' : value,
            );
          }
        });
      }

      function setWholeModuleOpacity(module, opacity, revealedEmphasis = false) {
        module.style.setProperty('--prototype-module-opacity', clamp01(opacity).toFixed(4));
        setWordOpacity(getWordNodes(module), opacity, revealedEmphasis);
      }

      function getLineGroups(module) {
        return Array.from(module.querySelectorAll('[data-editorial-visual-line]')).map((line) => ({
          node: line,
          words: getWordNodes(line),
        })).filter((line) => line.words.length);
      }

      function getClauseGroups(module) {
        const clauses = [];
        let current = [];
        getWordNodes(module).forEach((word) => {
          current.push(word);
          if (/[.!?…][”’"')\]]*$/.test(word.textContent.trim())) {
            clauses.push(current);
            current = [];
          }
        });
        if (current.length) clauses.push(current);
        return clauses;
      }

      function getActiveModuleIndex(modules) {
        let activeIndex = -1;
        modules.forEach((module, index) => {
          if (maximumProgress(getRevealNodes(module)) >= 0.18) activeIndex = index;
        });
        return activeIndex;
      }

      function applyModuleNeighbourState(modules, activeIndex) {
        modules.forEach((module, index) => {
          if (index === activeIndex) return;
          if (index === activeIndex - 1) setWholeModuleOpacity(module, 0.4, true);
          else if (index < activeIndex - 1) setWholeModuleOpacity(module, 0.14, true);
          else setWholeModuleOpacity(module, 0.04, false);
        });
      }

      function updateLineBaton(documentRoot, reducedMotion) {
        documentRoot.querySelectorAll('.about-narrative-editorial-stack').forEach((stack) => {
          const modules = getModules(stack);
          const activeIndex = getActiveModuleIndex(modules);
          applyModuleNeighbourState(modules, activeIndex);
          const activeModule = modules[activeIndex];
          if (!activeModule) return;
          const lines = getLineGroups(activeModule);
          if (!lines.length) {
            const progress = averageProgress(getRevealNodes(activeModule));
            setWholeModuleOpacity(activeModule, reducedMotion
              ? 1
              : mix(0.04, 1, smoothstep(0.12, 0.72, progress)));
            return;
          }
          activeModule.style.setProperty('--prototype-module-opacity', '1');
          lines.forEach(({ words }) => {
            const progress = averageProgress(words);
            setWordOpacity(words, reducedMotion
              ? 1
              : mix(0.04, 1, smoothstep(0.12, 0.72, progress)));
          });
        });
      }

      function updateClauseSpotlight(documentRoot, reducedMotion) {
        documentRoot.querySelectorAll('.about-narrative-editorial-stack').forEach((stack) => {
          const modules = getModules(stack);
          const activeIndex = getActiveModuleIndex(modules);
          applyModuleNeighbourState(modules, activeIndex);
          const activeModule = modules[activeIndex];
          if (!activeModule) return;
          const clauses = getClauseGroups(activeModule);
          if (!clauses.length) {
            const progress = averageProgress(getRevealNodes(activeModule));
            setWholeModuleOpacity(activeModule, reducedMotion
              ? 1
              : mix(0.04, 1, smoothstep(0.16, 0.7, progress)));
            return;
          }
          activeModule.style.setProperty('--prototype-module-opacity', '1');
          if (reducedMotion) {
            clauses.forEach((clause) => setWordOpacity(clause, 1));
            return;
          }
          let activeClause = -1;
          clauses.forEach((clause, index) => {
            if (maximumProgress(clause) >= 0.2) activeClause = index;
          });
          clauses.forEach((clause, index) => {
            if (index < activeClause) setWordOpacity(clause, 0.42, true);
            else if (index > activeClause) setWordOpacity(clause, 0.04);
            else {
              const progress = averageProgress(clause);
              setWordOpacity(clause, mix(0.42, 1, smoothstep(0.12, 0.7, progress)));
            }
          });
        });
      }

      function markPhrase(documentRoot, phrase, variantKey) {
        documentRoot.querySelectorAll('.about-narrative-editorial-lines__output').forEach((output) => {
          const walker = documentRoot.createTreeWalker(
            output,
            documentRoot.defaultView.NodeFilter.SHOW_TEXT,
          );
          const nodes = [];
          let node = walker.nextNode();
          while (node) {
            nodes.push(node);
            node = walker.nextNode();
          }
          const fullText = nodes.map((textNode) => textNode.nodeValue || '').join('');
          let phraseStart = fullText.indexOf(phrase);
          while (phraseStart >= 0) {
            const phraseEnd = phraseStart + phrase.length;
            let nodeStart = 0;
            nodes.forEach((textNode) => {
              const nodeEnd = nodeStart + (textNode.nodeValue?.length || 0);
              if (nodeStart < phraseEnd && nodeEnd > phraseStart) {
                textNode.parentElement?.closest('[data-editorial-reveal="word"]')
                  ?.setAttribute('data-prototype-emphasis', variantKey);
              }
              nodeStart = nodeEnd;
            });
            phraseStart = fullText.indexOf(phrase, phraseEnd);
          }
        });
      }

      function markEmphasis(documentRoot, variantKey) {
        EMPHASIS_PHRASES.forEach((phrase) => markPhrase(documentRoot, phrase, variantKey));
      }

      function clearVariant(documentRoot) {
        documentRoot.defaultView.cancelAnimationFrame(focusFrame);
        focusFrame = 0;
        documentRoot.defaultView.__aboutReadingFocusPrototypeObserver?.disconnect();
        documentRoot.defaultView.__aboutReadingFocusPrototypeObserver = null;
        documentRoot.querySelector('#about-reading-focus-prototype-style')?.remove();
        documentRoot.querySelectorAll('[data-prototype-emphasis]').forEach((node) => {
          node.removeAttribute('data-prototype-emphasis');
          node.style.removeProperty('--prototype-emphasis-opacity');
        });
        documentRoot.querySelectorAll('[style*="--prototype-focus-opacity"]').forEach((node) => {
          node.style.removeProperty('--prototype-focus-opacity');
        });
        documentRoot.querySelectorAll('[style*="--prototype-module-opacity"]').forEach((node) => {
          node.style.removeProperty('--prototype-module-opacity');
        });
        documentRoot.querySelectorAll('[style*="--prototype-emphasis-opacity"]').forEach((node) => {
          node.style.removeProperty('--prototype-emphasis-opacity');
        });
        documentRoot.documentElement.removeAttribute('data-about-reading-focus');
        documentRoot.documentElement.removeAttribute('data-about-focus-motion');
      }

      function startFocusLoop(documentRoot, variantKey) {
        const tick = () => {
          const root = documentRoot.querySelector('.about-narrative-lab');
          const reducedMotion = readMotionMode() === 'reduced'
            || root?.dataset.aboutMotionProfile === 'reduced';
          if (variantKey === 'B') updateLineBaton(documentRoot, reducedMotion);
          if (variantKey === 'C') updateClauseSpotlight(documentRoot, reducedMotion);
          focusFrame = documentRoot.defaultView.requestAnimationFrame(tick);
        };
        tick();
      }

      function applyVariant() {
        const documentRoot = frame.contentDocument;
        if (!documentRoot?.head || !documentRoot.body) return;
        clearVariant(documentRoot);
        const variant = readVariant();
        updateSwitcher(variant);
        documentRoot.documentElement.setAttribute('data-about-reading-focus', variant.key);
        documentRoot.documentElement.setAttribute('data-about-focus-motion', readMotionMode());

        const style = documentRoot.createElement('style');
        style.id = 'about-reading-focus-prototype-style';
        style.textContent = `
          html[data-about-reading-focus] .about-narrative-editorial-unit {
            width: min(100%, 46rem) !important;
          }

          html[data-about-reading-focus] .about-narrative-editorial-stack > .about-narrative-editorial-copy {
            max-width: 45ch !important;
          }

          html[data-about-reading-focus] .about-narrative-editorial-list {
            width: min(100%, 18ch) !important;
            margin-block: clamp(2.5rem, 8.5svh, 6rem) !important;
            color: var(--about-editorial-ink);
            font-family: var(--abs-font-headline);
            font-style: italic;
            font-size: calc(var(--about-editorial-type-size) * 2.4);
          }

          html[data-about-reading-focus] .about-narrative-editorial-list ul {
            padding: 0 !important;
            margin: 0 !important;
            list-style: none !important;
          }

          html[data-about-reading-focus] .about-narrative-editorial-list li,
          html[data-about-reading-focus] .about-narrative-editorial-stack > .about-narrative-editorial-list li {
            display: block !important;
            padding: 0 !important;
            border: 0 !important;
            font-size: 1em !important;
            font-weight: 400 !important;
            letter-spacing: var(--abs-font-headline-letter-spacing) !important;
            line-height: 1 !important;
          }

          html[data-about-reading-focus] .about-narrative-editorial-list li::before,
          html[data-about-reading-focus] .about-narrative-editorial-stack > .about-narrative-editorial-list li::before {
            display: none !important;
            content: none !important;
          }

          html[data-about-reading-focus] [data-prototype-emphasis] {
            color: var(--text-primary) !important;
            font-weight: 600 !important;
          }

          html[data-about-reading-focus='B'] [data-editorial-reveal='word'],
          html[data-about-reading-focus='C'] [data-editorial-reveal='word'] {
            opacity: var(--prototype-focus-opacity, 0.04) !important;
            transition: opacity 120ms linear;
          }

          html[data-about-reading-focus='B'] [data-editorial-reveal='word'][data-prototype-emphasis],
          html[data-about-reading-focus='C'] [data-editorial-reveal='word'][data-prototype-emphasis] {
            opacity: var(
              --prototype-emphasis-opacity,
              0
            ) !important;
          }

          html[data-about-reading-focus='B'] .about-narrative-editorial-stack > .about-narrative-client-field,
          html[data-about-reading-focus='B'] .about-narrative-editorial-stack > .about-interactive-stack,
          html[data-about-reading-focus='B'] .about-narrative-editorial-stack > .about-narrative-media-deck,
          html[data-about-reading-focus='C'] .about-narrative-editorial-stack > .about-narrative-client-field,
          html[data-about-reading-focus='C'] .about-narrative-editorial-stack > .about-interactive-stack,
          html[data-about-reading-focus='C'] .about-narrative-editorial-stack > .about-narrative-media-deck {
            opacity: var(--prototype-module-opacity, 0.04) !important;
            transition: opacity 160ms ease-out;
          }

          html[data-about-focus-motion='reduced'] [data-editorial-reveal='word'],
          html[data-about-focus-motion='reduced'] .about-narrative-editorial-stack > * {
            transition: none !important;
          }
        `;
        documentRoot.head.append(style);
        markEmphasis(documentRoot, variant.key);
        const observer = new documentRoot.defaultView.MutationObserver(() => {
          markEmphasis(documentRoot, variant.key);
        });
        observer.observe(documentRoot.body, { childList: true, subtree: true });
        documentRoot.defaultView.__aboutReadingFocusPrototypeObserver = observer;
        if (variant.key !== 'A') startFocusLoop(documentRoot, variant.key);
      }

      if (!localHosts.has(window.location.hostname)) {
        frame.hidden = true;
        switcher.hidden = true;
        blocked.style.display = 'grid';
      } else {
        previous.addEventListener('click', () => cycleVariant(-1));
        next.addEventListener('click', () => cycleVariant(1));
        window.addEventListener('keydown', handleArrowKey);
        frame.addEventListener('load', () => {
          frame.contentWindow.addEventListener('keydown', handleArrowKey);
          applyVariant();
        });
        frame.src = `/about.html?edit=${prototypeParams.get('edit') === '1' ? '1' : '0'}&prototype=reading-focus`;
        updateSwitcher(readVariant());
      }
    </script>
  </body>
</html>
