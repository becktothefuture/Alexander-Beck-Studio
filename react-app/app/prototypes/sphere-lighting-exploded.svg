<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600px" height="1000px" viewBox="0 0 1600 1000" version="1.1"><title>Exploded sphere lighting system</title><desc>An infographic explaining how dynamic palette colours become realistic matte sphere stickers through five flattened lighting cues and a cached draw-only runtime.</desc><rect x="0" y="0" width="1600" height="1000" fill="#0f1115" /><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#68717d" /></marker><marker id="arrowBright" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#78d9ff" /></marker><radialGradient id="keyLayer" gradientUnits="userSpaceOnUse" cx="350" cy="480" r="62" fx="327" fy="452"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" /><stop offset="38%" stop-color="#fff3e2" stop-opacity="0.52" /><stop offset="76%" stop-color="#ffffff" stop-opacity="0.08" /><stop offset="100%" stop-color="#ffffff" stop-opacity="0" /></radialGradient><linearGradient id="ambientLayer" gradientUnits="userSpaceOnUse" x1="540" y1="398" x2="540" y2="522"><stop offset="0%" stop-color="#76ddff" stop-opacity="0.92" /><stop offset="48%" stop-color="#8f78ff" stop-opacity="0.28" /><stop offset="100%" stop-color="#ff9a68" stop-opacity="0.6" /></linearGradient><radialGradient id="rimLayer" gradientUnits="userSpaceOnUse" cx="730" cy="440" r="62" fx="730" fy="440"><stop offset="0%" stop-color="#76e4ff" stop-opacity="0" /><stop offset="70%" stop-color="#76e4ff" stop-opacity="0.03" /><stop offset="91%" stop-color="#76e4ff" stop-opacity="0.5" /><stop offset="100%" stop-color="#e5fbff" stop-opacity="0.95" /></radialGradient><linearGradient id="ambientIcon" gradientUnits="userSpaceOnUse" x1="466" y1="839" x2="466" y2="883"><stop offset="0%" stop-color="#76ddff" stop-opacity="0.92" /><stop offset="48%" stop-color="#8f78ff" stop-opacity="0.4" /><stop offset="100%" stop-color="#ff9a68" stop-opacity="0.72" /></linearGradient><linearGradient id="bounceLayer" gradientUnits="userSpaceOnUse" x1="730" y1="378" x2="730" y2="502"><stop offset="0%" stop-color="#ff984f" stop-opacity="0" /><stop offset="58%" stop-color="#ff984f" stop-opacity="0.05" /><stop offset="100%" stop-color="#ff984f" stop-opacity="0.9" /></linearGradient><radialGradient id="shadowLayer" gradientUnits="userSpaceOnUse" cx="920" cy="420" r="64" fx="890" fy="385"><stop offset="0%" stop-color="#ab8bff" stop-opacity="0.18" /><stop offset="48%" stop-color="#633e98" stop-opacity="0.28" /><stop offset="78%" stop-color="#28183f" stop-opacity="0.76" /><stop offset="100%" stop-color="#090b12" stop-opacity="0.98" /></radialGradient><radialGradient id="finalForm" gradientUnits="userSpaceOnUse" cx="1305" cy="485" r="132" fx="1255" fy="427"><stop offset="0%" stop-color="#ffc0a0" /><stop offset="23%" stop-color="#ff7588" /><stop offset="56%" stop-color="#ed3e79" /><stop offset="80%" stop-color="#b82c77" /><stop offset="100%" stop-color="#49184f" /></radialGradient><radialGradient id="finalKey" gradientUnits="userSpaceOnUse" cx="1305" cy="485" r="132" fx="1250" fy="418"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.68" /><stop offset="28%" stop-color="#fff8eb" stop-opacity="0.2" /><stop offset="65%" stop-color="#ffffff" stop-opacity="0" /><stop offset="100%" stop-color="#ffffff" stop-opacity="0" /></radialGradient><radialGradient id="stableIcon" gradientUnits="userSpaceOnUse" cx="1208" cy="862" r="15" fx="1202" fy="855"><stop offset="0%" stop-color="#ffc0a0" /><stop offset="32%" stop-color="#ff7588" /><stop offset="72%" stop-color="#c93477" /><stop offset="100%" stop-color="#49184f" /></radialGradient><linearGradient id="finalAmbient" gradientUnits="userSpaceOnUse" x1="1305" y1="353" x2="1305" y2="617"><stop offset="0%" stop-color="#7fe4ff" stop-opacity="0.34" /><stop offset="47%" stop-color="#8172ff" stop-opacity="0.04" /><stop offset="100%" stop-color="#ff995d" stop-opacity="0.32" /></linearGradient><radialGradient id="finalRim" gradientUnits="userSpaceOnUse" cx="1305" cy="485" r="132" fx="1305" fy="485"><stop offset="0%" stop-color="#90ecff" stop-opacity="0" /><stop offset="80%" stop-color="#90ecff" stop-opacity="0" /><stop offset="96%" stop-color="#90ecff" stop-opacity="0.24" /><stop offset="100%" stop-color="#e8fbff" stop-opacity="0.5" /></radialGradient><linearGradient id="lightMini" gradientUnits="userSpaceOnUse" x1="1218" y1="636" x2="1248" y2="712"><stop offset="0%" stop-color="#d5fbff" /><stop offset="30%" stop-color="#ff8f9f" /><stop offset="100%" stop-color="#d53078" /></linearGradient><radialGradient id="darkMini" gradientUnits="userSpaceOnUse" cx="1425" cy="674" r="42" fx="1408" fy="654"><stop offset="0%" stop-color="#ff8ca0" /><stop offset="45%" stop-color="#d33b7d" /><stop offset="100%" stop-color="#35113f" /></radialGradient><clipPath id="finalClip"><circle fill="#ffffff" cx="1305" cy="485" r="130" /></clipPath></defs><text fill="#78d9ff" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2" x="60" y="48">SPHERE MATERIAL SYSTEM / EXPLODED VIEW</text><text fill="#f5f7fa" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" x="60" y="88">One dynamic colour. Five lighting cues. One cached matte sphere.</text><text fill="#98a1ad" font-family="Inter, Arial, sans-serif" font-size="15" x="60" y="116">The cues are calculated together per pixel, flattened before motion starts, and never rotate with the ball.</text><rect fill="#171a20" stroke="#2b3039" stroke-width="1" x="60" y="146" width="300" height="118" rx="14" ry="14" /><text fill="#f0f3f6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" x="82" y="171">1  DYNAMIC COLOUR</text><circle fill="#00a7ff" cx="94" cy="208" r="13" /><circle fill="#ff4f7b" cx="130" cy="208" r="13" /><circle fill="#00c9a7" cx="166" cy="208" r="13" /><circle fill="#ffad16" cx="202" cy="208" r="13" /><circle fill="#f0eee8" cx="238" cy="208" r="13" /><circle fill="#7e8991" cx="274" cy="208" r="13" /><text fill="#8f98a5" font-family="Inter, Arial, sans-serif" font-size="12" x="82" y="244">Palette snapshot + current theme</text><line stroke="#68717d" stroke-width="2" marker-end="url(#arrow)" x1="373" y1="205" x2="405" y2="205" /><rect fill="#171a20" stroke="#2b3039" stroke-width="1" x="420" y="146" width="300" height="118" rx="14" ry="14" /><text fill="#f0f3f6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" x="442" y="171">2  NORMALISE ONCE</text><text fill="#00a7ff" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="700" x="442" y="205">#00A7FF</text><text fill="#66707d" font-family="Inter, Arial, sans-serif" font-size="18" x="535" y="205">=</text><text fill="#b8c0ca" font-family="ui-monospace, Menlo, monospace" font-size="13" x="560" y="205">rgba(0,167,255,1)</text><text fill="#8f98a5" font-family="Inter, Arial, sans-serif" font-size="12" x="442" y="244">Aliases share one packed RGB cache key</text><line stroke="#68717d" stroke-width="2" marker-end="url(#arrow)" x1="733" y1="205" x2="765" y2="205" /><rect fill="#171a20" stroke="#2b3039" stroke-width="1" x="780" y="146" width="300" height="118" rx="14" ry="14" /><text fill="#f0f3f6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" x="802" y="171">3  SHADE IN OKLAB</text><circle fill="none" stroke="#4c5562" stroke-width="1.5" cx="828" cy="213" r="23" /><line stroke="#78d9ff" stroke-width="2.5" marker-end="url(#arrowBright)" x1="828" y1="213" x2="811" y2="194" /><text fill="#d7dce2" font-family="ui-monospace, Menlo, monospace" font-size="14" x="870" y="207">N(x, y, z) · light field</text><text fill="#8f98a5" font-family="Inter, Arial, sans-serif" font-size="12" x="802" y="244">Lightness changes; hue and chroma survive</text><line stroke="#68717d" stroke-width="2" marker-end="url(#arrow)" x1="1093" y1="205" x2="1125" y2="205" /><rect fill="#171a20" stroke="#2b3039" stroke-width="1" x="1140" y="146" width="400" height="118" rx="14" ry="14" /><text fill="#f0f3f6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" x="1162" y="171">4  FLATTEN + CACHE</text><text fill="#ff7f9a" font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="700" x="1162" y="207">RGB × ENVIRONMENT × DETAIL</text><text fill="#d7dce2" font-family="ui-monospace, Menlo, monospace" font-size="14" x="1162" y="229">→ one final RGBA sticker</text><text fill="#8f98a5" font-family="Inter, Arial, sans-serif" font-size="12" x="1162" y="250">Runtime prototype: prewarmed before the loop</text><text fill="#f0f3f6" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.6" x="60" y="318">THE FIVE CUES — EXPLODED</text><path fill="none" stroke="#323842" stroke-width="1.5" stroke-dasharray="5 8" d="M120 505 C360 470 690 430 1010 404" /><circle fill="#ff4f7b" stroke="#ff7897" stroke-width="1" cx="160" cy="500" r="62" /><circle fill="#252a32" stroke="#464e5a" stroke-width="1" cx="112" cy="454" r="15" /><text fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" x="112" y="454" text-anchor="middle" dominant-baseline="middle">1</text><text fill="#ff8da5" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8" x="160" y="582" text-anchor="middle">BASE CHROMA</text><text fill="#8f98a5" font-family="Inter, Arial, sans-serif" font-size="11" x="160" y="604" text-anchor="middle">Original palette hue<tspan x="160" dy="15.95">No grey wash</tspan></text><line stroke="#68717d" stroke-width="1.5" marker-end="url(#arrow)" x1="232" y1="492" x2="278" y2="482" /><circle fill="#191c23" stroke="#343a45" stroke-width="1" cx="350" cy="480" r="62" /><circle fill="url(#keyLayer)" cx="350" cy="480" r="62" /><circle fill="#252a32" stroke="#464e5a" stroke-width="1" cx="302" cy="434" r="15" /><text fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" x="302" y="434" text-anchor="middle" dominant-baseline="middle">2</text><text fill="#fff1d9" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8" x="350" y="582" text-anchor="middle">MATTE KEY</text><text fill="#8f98a5" font-family="Inter, Arial, sans-serif" font-size="11" x="350" y="604" text-anchor="middle">Wrapped diffuse light<tspan x="350" dy="15.95">Broad, soft highlight</tspan></text><line stroke="#68717d" stroke-width="1.5" marker-end="url(#arrow)" x1="422" y1="472" x2="468" y2="462" /><circle fill="#191c23" stroke="#343a45" stroke-width="1" cx="540" cy="460" r="62" /><circle fill="url(#ambientLayer)" cx="540" cy="460" r="62" /><circle fill="#252a32" stroke="#464e5a" stroke-width="1" cx="492" cy="414" r="15" /><text fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" x="492" y="414" text-anchor="middle" dominant-baseline="middle">3</text><text fill="#8fe6ff" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8" x="540" y="582" text-anchor="middle">AMBIENT WRAP</text><text fill="#8f98a5" font-family="Inter, Arial, sans-serif" font-size="11" x="540" y="604" text-anchor="middle">Sky + horizon field<tspan x="540" dy="15.95">Room colour reaches edges</tspan></text><line stroke="#68717d" stroke-width="1.5" marker-end="url(#arrow)" x1="612" y1="452" x2="658" y2="442" /><circle fill="#191c23" stroke="#343a45" stroke-width="1" cx="730" cy="440" r="62" /><circle fill="url(#rimLayer)" cx="730" cy="440" r="62" /><circle fill="url(#bounceLayer)" cx="730" cy="440" r="62" /><circle fill="#252a32" stroke="#464e5a" stroke-width="1" cx="682" cy="394" r="15" /><text fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" x="682" y="394" text-anchor="middle" dominant-baseline="middle">4</text><text fill="#8fe6ff" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8" x="730" y="582" text-anchor="middle">RIM + BOUNCE</text><text fill="#8f98a5" font-family="Inter, Arial, sans-serif" font-size="11" x="730" y="604" text-anchor="middle">Cool silhouette light<tspan x="730" dy="15.95">Warm return from below</tspan></text><line stroke="#68717d" stroke-width="1.5" marker-end="url(#arrow)" x1="802" y1="432" x2="848" y2="422" /><circle fill="url(#shadowLayer)" stroke="#343a45" stroke-width="1" cx="920" cy="420" r="62" /><circle fill="#252a32" stroke="#464e5a" stroke-width="1" cx="872" cy="374" r="15" /><text fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" x="872" y="374" text-anchor="middle" dominant-baseline="middle">5</text><text fill="#bca3ff" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8" x="920" y="582" text-anchor="middle">SHADOW FORM</text><text fill="#8f98a5" font-family="Inter, Arial, sans-serif" font-size="11" x="920" y="604" text-anchor="middle">Terminator + occlusion<tspan x="920" dy="15.95">Deep colour, not grey</tspan></text><line stroke="#78d9ff" stroke-width="2.2" marker-end="url(#arrowBright)" x1="1002" y1="426" x2="1135" y2="452" /><text fill="#78d9ff" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" x="1068" y="408" text-anchor="middle">FLATTEN</text><circle fill="url(#finalForm)" stroke="#ff90a6" stroke-width="1" cx="1305" cy="485" r="132" /><circle fill="url(#finalAmbient)" cx="1305" cy="485" r="132" /><circle fill="url(#finalKey)" cx="1305" cy="485" r="132" /><circle fill="url(#finalRim)" cx="1305" cy="485" r="132" /><g fill="#ffffff" opacity="0.055" clip-path="url(#finalClip)"><circle cx="1247" cy="431" r="2" /><circle cx="1278" cy="449" r="1.5" /><circle cx="1321" cy="422" r="1.2" /><circle cx="1355" cy="455" r="1.7" /><circle cx="1229" cy="486" r="1.4" /><circle cx="1294" cy="498" r="1.8" /><circle cx="1371" cy="508" r="1.3" /><circle cx="1259" cy="541" r="1.6" /><circle cx="1334" cy="554" r="1.2" /><circle cx="1382" cy="568" r="1.5" /></g><text fill="#ff91a7" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.3" x="1305" y="325" text-anchor="middle">FINAL COMPOSITE</text><text fill="#8f98a5" font-family="ui-monospace, Menlo, monospace" font-size="12" x="1305" y="346" text-anchor="middle">one flat RGBA sticker</text><line stroke="#76818e" stroke-width="1.2" x1="1239" y1="396" x2="1175" y2="353" /><text fill="#b9c1ca" font-family="Inter, Arial, sans-serif" font-size="11" x="1165" y="346" text-anchor="end">fixed screen-space key</text><line stroke="#76818e" stroke-width="1.2" x1="1386" y1="570" x2="1472" y2="606" /><text fill="#b9c1ca" font-family="Inter, Arial, sans-serif" font-size="11" x="1482" y="611">saturated edge shadow</text><circle fill="url(#lightMini)" stroke="#d7f7ff" stroke-width="1" cx="1218" cy="674" r="40" /><text fill="#d7f7ff" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.8" x="1218" y="731" text-anchor="middle">LIGHT ROOM</text><text fill="#7f8996" font-family="Inter, Arial, sans-serif" font-size="10" x="1218" y="748" text-anchor="middle">broad ambient rim</text><circle fill="url(#darkMini)" stroke="#8c568a" stroke-width="1" cx="1425" cy="674" r="40" /><text fill="#dcb1dd" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.8" x="1425" y="731" text-anchor="middle">DARK ROOM</text><text fill="#7f8996" font-family="Inter, Arial, sans-serif" font-size="10" x="1425" y="748" text-anchor="middle">deep edge occlusion</text><rect fill="#15181e" stroke="#2a3038" stroke-width="1" x="60" y="790" width="1480" height="148" rx="16" ry="16" /><text fill="#f0f3f6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" x="86" y="819">WHY IT LOOKS REAL</text><circle fill="none" stroke="#78d9ff" stroke-width="1.5" cx="104" cy="861" r="22" /><line stroke="#78d9ff" stroke-width="2" marker-end="url(#arrowBright)" x1="104" y1="861" x2="88" y2="844" /><text fill="#dce2e8" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" x="142" y="852">GEOMETRY-AWARE</text><text fill="#88929f" font-family="Inter, Arial, sans-serif" font-size="11" x="142" y="873">Every pixel gets a sphere normal.<tspan x="142" dy="15.95">Light and shadow agree spatially.</tspan></text><circle fill="url(#ambientIcon)" stroke="#607788" stroke-width="1" cx="466" cy="861" r="22" /><text fill="#dce2e8" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" x="504" y="852">ENVIRONMENT-AWARE</text><text fill="#88929f" font-family="Inter, Arial, sans-serif" font-size="11" x="504" y="873">Sky, horizon and floor surround it.<tspan x="504" dy="15.95">Light and dark rooms feel different.</tspan></text><circle fill="#ff4f7b" stroke="#ff9aad" stroke-width="1" cx="828" cy="861" r="22" /><circle fill="#ffb0a4" opacity="0.8" cx="836" cy="853" r="7" /><text fill="#dce2e8" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" x="866" y="852">COLOUR-PRESERVING</text><text fill="#88929f" font-family="Inter, Arial, sans-serif" font-size="11" x="866" y="873">OKLab keeps hue and chroma alive.<tspan x="866" dy="15.95">Highlights and shadows stay vibrant.</tspan></text><rect fill="#242a32" stroke="#4c5664" stroke-width="1" x="1185" y="839" width="46" height="46" rx="8" ry="8" /><circle fill="url(#stableIcon)" cx="1208" cy="862" r="15" /><text fill="#dce2e8" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" x="1247" y="852">STABLE + CHEAP</text><text fill="#88929f" font-family="Inter, Arial, sans-serif" font-size="11" x="1247" y="873">The sticker never rotates.<tspan x="1247" dy="15.95">Animation only draws cached pixels.</tspan></text><rect fill="#1b2027" x="60" y="958" width="1480" height="28" rx="14" ry="14" /><text fill="#aeb7c2" font-family="ui-monospace, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="0.3" x="800" y="972" text-anchor="middle" dominant-baseline="middle">PALETTE CHANGES  →  invalidate affected aliases  →  prewarm 6–8 stickers  →  ANIMATION LOOP: draw cached bitmap only</text></svg>