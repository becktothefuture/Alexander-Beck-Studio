<!doctype html>
<!--
  Throwaway Wayfinder prototype. One integrated approved B direction, switchable
  by narrative moment, on the real local About route. Production is unchanged.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Prototype — Integrated About refinement</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      .prototype-frame {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #000;
      }

      .prototype-moments {
        position: fixed;
        top: 1rem;
        left: 50%;
        z-index: 110;
        display: flex;
        max-width: calc(100vw - 2rem);
        overflow: auto hidden;
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 999px;
        background: rgb(12 12 12 / 94%);
        box-shadow: 0 12px 38px rgb(0 0 0 / 32%);
        transform: translateX(-50%);
        backdrop-filter: blur(18px);
        scrollbar-width: none;
      }

      .prototype-moments::-webkit-scrollbar {
        display: none;
      }

      .prototype-moments button {
        flex: 0 0 auto;
        min-height: 2.5rem;
        padding: 0.55rem 0.78rem;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: rgb(255 255 255 / 54%);
        font: 650 0.62rem/1 Arial, sans-serif;
        letter-spacing: 0.02em;
        cursor: pointer;
      }

      .prototype-moments button:hover,
      .prototype-moments button:focus-visible,
      .prototype-moments button[aria-pressed='true'] {
        background: rgb(255 255 255 / 14%);
        color: #fff;
        outline: 0;
      }

      .prototype-label {
        position: fixed;
        right: 50%;
        bottom: 5.75rem;
        z-index: 110;
        display: grid;
        gap: 0.12rem;
        min-width: 18rem;
        padding: 0.64rem 1.2rem 0.62rem;
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 999px;
        background: rgb(12 12 12 / 94%);
        box-shadow: 0 12px 38px rgb(0 0 0 / 38%);
        color: #fff;
        text-align: center;
        transform: translateX(50%);
        backdrop-filter: blur(18px);
      }

      .prototype-label small {
        color: rgb(255 255 255 / 52%);
        font-size: 0.58rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        line-height: 1;
        text-transform: uppercase;
      }

      .prototype-label strong {
        font-size: 0.78rem;
        font-weight: 650;
        letter-spacing: 0.01em;
        line-height: 1.2;
      }

      .prototype-status,
      .prototype-blocked {
        position: fixed;
        inset: 0;
        z-index: 120;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #000;
        color: #fff;
        text-align: center;
      }

      .prototype-blocked {
        display: none;
      }

      body[data-prototype-ready='true'] .prototype-status {
        display: none;
      }

      @media (max-width: 600px) {
        .prototype-moments {
          top: 0.6rem;
          max-width: calc(100vw - 1.2rem);
        }

        .prototype-moments button {
          min-height: 2.35rem;
          padding-inline: 0.7rem;
          font-size: 0.58rem;
        }

        .prototype-label {
          bottom: 4.8rem;
          min-width: 15.5rem;
          padding-inline: 1rem;
        }
      }
    </style>
  </head>
  <body data-prototype-ready="false">
    <iframe
      class="prototype-frame"
      id="integrated-prototype-frame"
      title="Integrated About refinement prototype"
    ></iframe>

    <nav class="prototype-moments" aria-label="Integrated narrative moments">
      <button type="button" data-moment="play">Play</button>
      <button type="button" data-moment="opening">Opening</button>
      <button type="button" data-moment="voice">Voice</button>
      <button type="button" data-moment="logos">Logos</button>
      <button type="button" data-moment="emphasis">Emphasis</button>
      <button type="button" data-moment="hold">Figure only</button>
      <button type="button" data-moment="invitation">Invitation</button>
      <button type="button" data-moment="endpoint">Endpoint</button>
    </nav>

    <span class="prototype-label" aria-label="Approved integrated prototype direction">
      <small id="prototype-meta">Complete B contract · 0.00 WU</small>
      <strong>B — Integrated editorial material</strong>
    </span>

    <p class="prototype-status" id="prototype-status">Preparing the integrated About narrative…</p>
    <p class="prototype-blocked" id="prototype-blocked">
      This throwaway comparison is available only on the local development site.
    </p>

    <script>
      const END_WU = 22.795;
      const HOLD_CAMERA_ID = 'prototype-integrated-finale-resolved-hold';
      const MOBILE_REFERENCE_WIDTH = 390;
      const SHARED_MATERIAL_WIDTH = 768;
      const MOBILE_POINT_POOL = 5000;
      const DESKTOP_POINT_POOL = 12000;
      const MOMENTS = {
        opening: 0,
        voice: 4.22,
        logos: 6.72,
        emphasis: 12.38,
        hold: 21.13,
        invitation: 22.48,
        endpoint: END_WU,
      };

      const frame = document.querySelector('#integrated-prototype-frame');
      const moments = document.querySelector('.prototype-moments');
      const meta = document.querySelector('#prototype-meta');
      const status = document.querySelector('#prototype-status');
      const blocked = document.querySelector('#prototype-blocked');
      const localHosts = new Set(['localhost', '127.0.0.1']);
      const params = new URLSearchParams(window.location.search);
      const reducedMotion = params.get('motion') === 'reduced';
      let activeStore = null;
      let activeRoot = null;
      let activeFinale = null;
      let updateTimer = 0;

      function wait(milliseconds) {
        return new Promise((resolve) => window.setTimeout(resolve, milliseconds));
      }

      async function waitFor(readValue, timeout = 60000) {
        const startedAt = performance.now();
        while (performance.now() - startedAt < timeout) {
          const value = readValue();
          if (value) return value;
          await wait(40);
        }
        throw new Error('The integrated About prototype did not become ready in time.');
      }

      function clone(value) {
        return JSON.parse(JSON.stringify(value));
      }

      function clamp01(value) {
        return Math.min(1, Math.max(0, Number(value) || 0));
      }

      function smoothstep(value) {
        const bounded = clamp01(value);
        return bounded * bounded * (3 - (2 * bounded));
      }

      function mix(from, to, amount) {
        return from + ((to - from) * amount);
      }

      function round(value, precision = 4) {
        const factor = 10 ** precision;
        return Math.round(value * factor) / factor;
      }

      function resolveOpeningComposition(width) {
        if (width >= SHARED_MATERIAL_WIDTH) {
          return { density: 0.17, scale: width > 1180 ? 0.52 : 0.44, yOffset: 0, interpolation: 1 };
        }
        const interpolation = smoothstep(
          (width - MOBILE_REFERENCE_WIDTH)
          / (SHARED_MATERIAL_WIDTH - MOBILE_REFERENCE_WIDTH),
        );
        return {
          density: mix(0.13, 0.17, interpolation),
          scale: mix(0.36, 0.44, interpolation),
          yOffset: mix(0.68, 0, interpolation),
          interpolation,
        };
      }

      function getEditorStore(documentRoot) {
        const editor = documentRoot.querySelector('.about-track-editor');
        const fiberKey = editor && Object.keys(editor).find((key) => key.startsWith('__reactFiber$'));
        let fiber = fiberKey ? editor[fiberKey] : null;
        while (fiber) {
          if (fiber.memoizedProps?.store?.getSnapshot) return fiber.memoizedProps.store;
          fiber = fiber.return;
        }
        return null;
      }

      function findButton(documentRoot, labelText) {
        return Array.from(documentRoot.querySelectorAll('button')).find((button) => (
          button.getAttribute('aria-label') === labelText
          || button.textContent.trim() === labelText
        ));
      }

      async function selectResponsivePreviewProfile(documentRoot) {
        const expectedProfile = documentRoot.defaultView.innerWidth <= 600 ? 'mobile' : 'desktop';
        const button = await waitFor(() => (
          Array.from(documentRoot.querySelectorAll('.about-track-editor-preview__profiles button'))
            .find((candidate) => candidate.textContent.trim().toLowerCase() === expectedProfile)
        ));
        button.click();
        await waitFor(() => {
          const root = documentRoot.querySelector('.about-narrative-lab');
          return root?.dataset.editorPreviewLayout === expectedProfile
            && root?.dataset.aboutLayoutProfile === expectedProfile;
        });
      }

      function installNestedStyles(logoDocument, focusDocument, aboutDocument) {
        const logoStyle = logoDocument.createElement('style');
        logoStyle.id = 'about-integrated-logo-chrome-style';
        logoStyle.textContent = '.prototype-label, .prototype-status { display: none !important; }';
        logoDocument.head.append(logoStyle);

        const focusStyle = focusDocument.createElement('style');
        focusStyle.id = 'about-integrated-focus-chrome-style';
        focusStyle.textContent = '.prototype-switcher, .prototype-blocked { display: none !important; }';
        focusDocument.head.append(focusStyle);

        const aboutStyle = aboutDocument.createElement('style');
        aboutStyle.id = 'about-integrated-refinement-style';
        aboutStyle.textContent = `
          .about-track-editor { opacity: 0 !important; }
          .about-narrative-lab[data-editor-active='true'] .about-narrative-scrollport,
          .about-narrative-lab[data-editor-active='true'] .about-narrative-world,
          .about-narrative-lab[data-editor-active='true'] .about-narrative-motion-layer {
            right: 0 !important;
          }
          .about-narrative-lab[data-prototype-integrated-cta-visible='false']
          [data-text-field-id='text-epilogue-invitation']
          .about-narrative-finale-content {
            visibility: hidden;
          }
          .about-narrative-lab[data-prototype-integrated-cta-visible='true']
          [data-text-field-id='text-epilogue-invitation']
          .route-title-lockup__rule {
            transform: scaleX(var(--prototype-integrated-rule-scale, 0)) !important;
          }
          .about-narrative-lab[data-prototype-integrated-cta-visible='true']
          [data-text-field-id='text-epilogue-invitation']
          .about-narrative-finale-description {
            opacity: calc(
              var(--route-intro-description-opacity)
              * var(--prototype-integrated-description-opacity, 0)
            ) !important;
          }
        `;
        aboutDocument.head.append(aboutStyle);
      }

      function suppressCameraFocusAnchor(documentRoot) {
        const canvas = documentRoot.querySelector('.about-narrative-world__canvas');
        const context = canvas?.getContext('webgl2') || canvas?.getContext('webgl');
        if (!context || context.__aboutIntegratedLinesSuppressed) return;
        const drawArrays = context.drawArrays.bind(context);
        const drawElements = context.drawElements.bind(context);
        context.drawArrays = (mode, first, count) => {
          if (mode === context.LINES) return;
          drawArrays(mode, first, count);
        };
        context.drawElements = (mode, count, type, offset) => {
          if (mode === context.LINES) return;
          drawElements(mode, count, type, offset);
        };
        context.__aboutIntegratedLinesSuppressed = true;
      }

      function hideDirector(documentRoot) {
        const director = documentRoot.querySelector('.about-track-editor');
        if (director) director.hidden = true;
        const root = documentRoot.querySelector('.about-narrative-lab');
        if (root) {
          delete root.dataset.editorActive;
          delete root.dataset.editorInspectorOpen;
        }
        documentRoot.querySelector(
          'button[aria-label="Toggle design panel"][aria-pressed="true"]',
        )?.click();
      }

      function applyIntegratedDocument(draft, width) {
        const composition = resolveOpeningComposition(width);
        draft.globals.pointMaterial.pointSize = 9.1;

        const states = new Map(
          draft.tracks.pointField.stateDefinitions.map((state) => [state.id, state]),
        );
        const promise = states.get('world-promise');
        promise.shapeParameters.density = composition.density;
        promise.shapeParameters.radius = round(2.5 * (composition.scale / 0.44));
        promise.transform.position[1] = round(2.25 + composition.yOffset);
        states.get('world-complexity').shapeParameters.density = 0.33;
        states.get('world-grid').shapeParameters.density = 0.32;
        states.get('world-emergent').shapeParameters.density = 0.26;

        const pointKeys = new Map(
          draft.tracks.pointField.keys.map((key) => [key.id, key]),
        );
        pointKeys.get('key-world-emergent-departure').atWU = 18.95;
        pointKeys.get('key-world-emergent-arrival').atWU = 20.55;
        const assembly = draft.tracks.pointField.segments.find(
          (segment) => segment.id
            === 'segment-key-world-emergent-departure-to-key-world-emergent-arrival',
        );
        assembly.transition.easing = 'smoothstep';

        const cameraKeys = draft.tracks.camera.keys;
        const rippleCamera = cameraKeys.find((key) => key.id === 'ripple-overhead-hold');
        const finalCamera = cameraKeys.find((key) => key.id === 'finale-hold');
        rippleCamera.atWU = 18.95;
        rippleCamera.easing = 'smoothstep';
        const holdCamera = clone(finalCamera);
        holdCamera.id = HOLD_CAMERA_ID;
        holdCamera.atWU = 20.55;
        holdCamera.locked = false;
        delete holdCamera.protected;
        cameraKeys.push(holdCamera);
        cameraKeys.sort((left, right) => left.atWU - right.atWU);
        Object.values(draft.profiles).forEach((profile) => {
          const finalOverride = profile.overrides?.camera?.['finale-hold'];
          if (finalOverride) profile.overrides.camera[HOLD_CAMERA_ID] = clone(finalOverride);
        });

        const interactions = new Map(
          draft.tracks.interactions.clips.map((clip) => [clip.id, clip]),
        );
        interactions.get('interaction-grid-ripple').endWU = 18.95;
        const emergentRipple = interactions.get('interaction-emergent-ripple');
        emergentRipple.startWU = 18.95;
        emergentRipple.activationWU = 19.35;
        emergentRipple.endWU = 20.85;

        const invitation = draft.tracks.text.fields.find(
          (field) => field.id === 'text-epilogue-invitation',
        );
        invitation.startWU = 21.25;
        invitation.focusWU = 21.7;
        invitation.endWU = END_WU;
      }

      function syncCtaVisibility(storyWU) {
        if (!activeRoot) return;
        activeRoot.dataset.prototypeIntegratedCtaVisible = storyWU >= 21.25
          ? 'true'
          : 'false';
        if (!activeFinale) return;
        if (reducedMotion || activeRoot.dataset.aboutMotionProfile === 'reduced') {
          activeFinale.style.setProperty(
            '--prototype-integrated-rule-scale',
            storyWU >= 21.25 ? '1' : '0',
          );
          activeFinale.style.setProperty(
            '--prototype-integrated-description-opacity',
            storyWU >= 21.7 ? '1' : '0',
          );
          return;
        }
        const postTitleProgress = clamp01((storyWU - 21.7) / (END_WU - 21.7));
        activeFinale.style.setProperty(
          '--prototype-integrated-rule-scale',
          String(smoothstep(postTitleProgress / 0.24)),
        );
        activeFinale.style.setProperty(
          '--prototype-integrated-description-opacity',
          String(smoothstep((postTitleProgress - 0.24) / 0.46)),
        );
      }

      function updateMomentSelection(moment) {
        moments.querySelectorAll('button[data-moment]').forEach((button) => {
          button.setAttribute('aria-pressed', button.dataset.moment === moment ? 'true' : 'false');
        });
      }

      function resolveMomentWU(moment) {
        if (moment === 'logos' && activeRoot?.dataset.aboutLayoutProfile === 'mobile') return 7;
        return MOMENTS[moment] ?? MOMENTS.opening;
      }

      function seekMoment(moment, { updateUrl = true } = {}) {
        if (!activeStore) return;
        if (moment === 'play') {
          activeStore.setTransport({
            owner: 'playback',
            playing: true,
            liveAmbient: true,
            loop: null,
            storyWU: 0,
          });
        } else {
          const storyWU = resolveMomentWU(moment);
          activeStore.setTransport({
            owner: 'timeline',
            playing: false,
            liveAmbient: false,
            storyWU,
          });
          syncCtaVisibility(storyWU);
        }
        updateMomentSelection(moment);
        if (updateUrl) {
          const url = new URL(window.location.href);
          url.searchParams.set('moment', moment);
          window.history.replaceState({}, '', url);
        }
      }

      function startStatusLoop() {
        window.clearTimeout(updateTimer);
        const tick = () => {
          const storyWU = Number(activeRoot?.dataset.narrativeStoryWu || 0);
          syncCtaVisibility(storyWU);
          meta.textContent = `Complete B contract · ${storyWU.toFixed(2)} WU${
            reducedMotion ? ' · reduced' : ''
          }`;
          updateTimer = window.setTimeout(tick, 100);
        };
        tick();
      }

      async function preparePrototype() {
        document.body.dataset.prototypeStage = 'logo-document';
        const logoDocument = await waitFor(() => {
          const documentRoot = frame.contentDocument;
          return documentRoot?.body
            && frame.contentWindow?.location?.pathname === '/prototypes/about-logo-pause.html'
            ? documentRoot
            : null;
        });
        document.body.dataset.prototypeStage = 'focus-frame';
        const focusFrame = await waitFor(() => (
          logoDocument.querySelector('#about-logo-prototype-frame')
        ));
        document.body.dataset.prototypeStage = 'focus-document';
        const focusDocument = await waitFor(() => {
          const documentRoot = focusFrame.contentDocument;
          return documentRoot?.body
            && focusFrame.contentWindow?.location?.pathname
              === '/prototypes/about-reading-focus.html'
            ? documentRoot
            : null;
        });
        document.body.dataset.prototypeStage = 'about-frame';
        const aboutFrame = await waitFor(() => focusDocument.querySelector('#about-prototype-frame'));
        document.body.dataset.prototypeStage = 'about-document';
        const aboutDocument = await waitFor(() => {
          const documentRoot = aboutFrame.contentDocument;
          return documentRoot?.body
            && aboutFrame.contentWindow?.location?.pathname === '/about.html'
            ? documentRoot
            : null;
        });
        installNestedStyles(logoDocument, focusDocument, aboutDocument);
        document.body.dataset.prototypeStage = 'editor';
        await waitFor(() => aboutDocument.querySelector('.about-track-editor'));
        document.body.dataset.prototypeStage = 'profile';
        await selectResponsivePreviewProfile(aboutDocument);
        document.body.dataset.prototypeStage = 'root';
        const root = await waitFor(() => aboutDocument.querySelector('.about-narrative-lab'));
        document.body.dataset.prototypeStage = 'store';
        const store = await waitFor(() => getEditorStore(aboutDocument), 10000);
        document.body.dataset.prototypeStage = 'commit';
        const committed = store.commit(
          'Prototype integrated About refinement',
          (draft) => applyIntegratedDocument(draft, aboutFrame.contentWindow.innerWidth),
          { selectionAfter: { type: 'track', id: 'point-field' }, requireValid: true },
        );
        if (!committed) throw new Error('Could not apply the integrated B contract.');

        const snapshot = store.getSnapshot();
        const errors = (snapshot.diagnostics || []).filter((item) => item.level === 'error');
        if (errors.length) throw new Error(errors.map((item) => item.message).join(' '));

        const composition = resolveOpeningComposition(aboutFrame.contentWindow.innerWidth);
        root.dataset.prototypeIntegratedVariant = 'B';
        root.dataset.prototypeIntegratedPointSize = '9.1';
        root.dataset.prototypeIntegratedDensities = [
          composition.density,
          0.33,
          0.32,
          0.26,
        ].map((value) => round(value)).join(',');
        root.dataset.prototypeIntegratedOpeningScale = round(composition.scale);
        root.dataset.prototypeIntegratedOpeningYOffset = round(composition.yOffset);
        root.dataset.prototypeIntegratedOpeningInterpolation = round(composition.interpolation);
        root.dataset.prototypeIntegratedVisibleOpeningPoints = String(Math.round(
          (aboutFrame.contentWindow.innerWidth > 1180 ? DESKTOP_POINT_POOL : MOBILE_POINT_POOL)
          * composition.density,
        ));
        root.dataset.prototypeIntegratedFormationStartWu = '18.95';
        root.dataset.prototypeIntegratedResolvedWu = '20.55';
        root.dataset.prototypeIntegratedCtaStartWu = '21.25';
        root.dataset.prototypeIntegratedCtaFocusWu = '21.7';
        root.dataset.prototypeIntegratedReady = 'true';

        activeStore = store;
        activeRoot = root;
        activeFinale = aboutDocument.querySelector(
          '[data-text-field-id="text-epilogue-invitation"]',
        );
        hideDirector(aboutDocument);
        suppressCameraFocusAnchor(aboutDocument);
        await wait(520);
        document.body.dataset.prototypeStage = 'world';
        await waitFor(() => root.dataset.worldPrepare === 'ready');
        seekMoment(params.get('moment') || 'opening', { updateUrl: false });
        startStatusLoop();
        document.body.dataset.prototypeReady = 'true';
        document.body.dataset.prototypeStage = 'ready';
        status.textContent = '';
      }

      function handleArrowKey(event) {
        const tagName = event.target?.tagName?.toLowerCase();
        if (tagName === 'input' || tagName === 'textarea' || event.target?.isContentEditable) return;
        if (!['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
        const buttons = Array.from(moments.querySelectorAll('button[data-moment]'));
        const currentIndex = buttons.findIndex((button) => button.getAttribute('aria-pressed') === 'true');
        const direction = event.key === 'ArrowLeft' ? -1 : 1;
        const nextIndex = (Math.max(0, currentIndex) + direction + buttons.length) % buttons.length;
        event.preventDefault();
        seekMoment(buttons[nextIndex].dataset.moment);
      }

      if (!localHosts.has(window.location.hostname)) {
        frame.hidden = true;
        moments.hidden = true;
        document.querySelector('.prototype-label').hidden = true;
        status.hidden = true;
        blocked.style.display = 'grid';
      } else {
        moments.addEventListener('click', (event) => {
          const button = event.target.closest('button[data-moment]');
          if (button) seekMoment(button.dataset.moment);
        });
        window.addEventListener('keydown', handleArrowKey, { capture: true });
        frame.addEventListener('load', () => {
          if (frame.contentWindow?.location?.pathname !== '/prototypes/about-logo-pause.html') {
            return;
          }
          preparePrototype().catch((error) => {
            console.error(error);
            status.textContent = 'Could not prepare the integrated About comparison.';
          });
        });
        frame.src = `/prototypes/about-logo-pause.html?variant=B&edit=1${
          reducedMotion ? '&motion=reduced' : ''
        }`;
      }
    </script>
  </body>
</html>
