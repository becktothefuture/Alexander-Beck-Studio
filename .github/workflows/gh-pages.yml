name: Deploy to GitHub Pages (React app)

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Install React dependencies
        run: |
          cd react-app/app
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Enforce node_modules hygiene
        run: |
          NODE_MODULES_DIFF="$(git diff --name-only | grep '^node_modules/' || true)"
          if [ -n "$NODE_MODULES_DIFF" ]; then
            echo "node_modules diffs are not allowed:"
            echo "$NODE_MODULES_DIFF"
            exit 1
          fi
          NODE_MODULES_DIFF_STAGED="$(git diff --name-only --staged | grep '^node_modules/' || true)"
          if [ -n "$NODE_MODULES_DIFF_STAGED" ]; then
            echo "staged node_modules diffs are not allowed:"
            echo "$NODE_MODULES_DIFF_STAGED"
            exit 1
          fi

      - name: Run canonical site gate and build
        run: npm run check:site

      - name: Build public About editor preview
        run: |
          npm run build:about-editor-preview
          npm run prepare:about-editor-preview

      - name: Verify build output
        run: |
          test -f react-app/app/dist/index.html || (echo "Missing react-app/app/dist/index.html" && exit 1)
          test -f react-app/app/dist/css/tokens.css || (echo "Missing CSS — public/ not copied to dist" && exit 1)
          test -f react-app/app/dist/config/default-config.json || (echo "Missing config — public/ not copied to dist" && exit 1)
          test -f react-app/app/dist/.nojekyll || (echo "Missing .nojekyll" && exit 1)
          test -f react-app/app/dist/editor-preview/lab/about-narrative.html || (echo "Missing About editor preview" && exit 1)
          echo "Build output verified:"
          ls -la react-app/app/dist/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dist artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: react-app/app/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
