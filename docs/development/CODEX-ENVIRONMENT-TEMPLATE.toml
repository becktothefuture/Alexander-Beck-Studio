# Codex local environment template for Alexander Beck Studio
# Save/copy this as: .codex/environments/environment.toml (outside git or in your local clone)

name = "Alexander Beck Studio"

[setup]
# Runs in repository root when worktree is created.
script = """
npm run install:all
npm run build
"""

[[actions]]
name = "Startup Menu"
command = "npm run startup"
description = "Interactive launcher for dev, install, and build flows"

[[actions]]
name = "Dev Server (8012)"
command = "npm run dev"
description = "Run the React/Vite dev server with HMR on port 8012"

[[actions]]
name = "Preview (8013)"
command = "npm run preview"
description = "Serve the built React app on port 8013"

[[actions]]
name = "Build"
command = "npm run build"
description = "Generate production dist output"

[[actions]]
name = "Check Site"
command = "npm run check:site"
description = "Run the full local site gate: token scan, HTML validation, simulation validation, lint, config parity, and build"

[[actions]]
name = "Clean"
command = "npm run clean"
description = "Remove build artifacts"

[[actions]]
name = "Precommit Checklist"
command = "npm run precommit:check"
description = "Run the lightweight precommit inspection checklist; use Check Site for the full gate"

[[actions]]
name = "Figma MCP Config"
command = "npm run figma:config"
description = "Write Cursor MCP config for TalkToFigma (optional)"

[[actions]]
name = "Figma Socket"
command = "npm run figma:socket"
description = "Start Figma socket bridge (optional)"

[platform_overrides.macos]
script = """
npm run install:all
npm run build
"""

[platform_overrides.linux]
script = """
npm run install:all
npm run build
"""

# Windows note:
# repo scripts invoke `python3` for local servers. Prefer WSL or ensure python3 is available.
[platform_overrides.windows]
script = """
npm run install:all
npm run build
"""
