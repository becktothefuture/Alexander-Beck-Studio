<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alexander Beck — Script title studies</title>
    <style>
      :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #ece9e2; color: #151515; }
      main { width: min(1680px, 100%); margin: 0 auto; padding: clamp(20px, 4vw, 64px); }
      header { max-width: 760px; margin-bottom: clamp(28px, 5vw, 64px); }
      h1 { margin: 0 0 12px; font-size: clamp(30px, 5vw, 68px); line-height: .95; letter-spacing: -.045em; }
      p { margin: 0; font-size: clamp(15px, 1.4vw, 20px); line-height: 1.45; color: #4f4d48; }
      section { margin: 0 0 clamp(44px, 7vw, 96px); }
      h2 { margin: 0 0 16px; font-size: clamp(18px, 2vw, 28px); letter-spacing: -.025em; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(14px, 2vw, 30px); }
      figure { margin: 0; border-radius: 18px; overflow: hidden; background: #111; box-shadow: 0 10px 32px rgba(0,0,0,.1); }
      img { display: block; width: 100%; height: auto; }
      figcaption { padding: 13px 16px 15px; background: #111; color: #fff; font-size: 13px; letter-spacing: .02em; }
      @media (max-width: 760px) {
        .grid { grid-template-columns: 1fr; }
        figure { border-radius: 12px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Script title studies</h1>
        <p>Eight hand-lettered homepage lockups. Four systems, each tested as a balanced and a more expressive composition.</p>
      </header>

      <section>
        <h2>01 — Sign-painter italic</h2>
        <div class="grid">
          <figure><img src="01a-sign-painter-balanced.png" alt="Balanced sign-painter title study" /><figcaption>01A — Balanced stack</figcaption></figure>
          <figure><img src="01b-sign-painter-offset.png" alt="Offset sign-painter title study" /><figcaption>01B — Offset stack</figcaption></figure>
        </div>
      </section>

      <section>
        <h2>02 — Seventies editorial brush</h2>
        <div class="grid">
          <figure><img src="02a-seventies-brush-emblem.png" alt="Compact seventies brush title study" /><figcaption>02A — Compact emblem</figcaption></figure>
          <figure><img src="02b-seventies-brush-cascade.png" alt="Cascading seventies brush title study" /><figcaption>02B — Interlocking cascade</figcaption></figure>
        </div>
      </section>

      <section>
        <h2>03 — Contemporary chancery</h2>
        <div class="grid">
          <figure><img src="03a-chancery-formal.png" alt="Formal chancery title study" /><figcaption>03A — Quietly formal</figcaption></figure>
          <figure><img src="03b-chancery-woven.png" alt="Woven chancery title study" /><figcaption>03B — Woven editorial</figcaption></figure>
        </div>
      </section>

      <section>
        <h2>04 — Interlocking script signet</h2>
        <div class="grid">
          <figure><img src="04a-interlocking-rectangle.png" alt="Rectangular interlocking script title study" /><figcaption>04A — Woven rectangle</figcaption></figure>
          <figure><img src="04b-interlocking-oval.png" alt="Oval interlocking script title study" /><figcaption>04B — Sculpted oval</figcaption></figure>
        </div>
      </section>
    </main>
  </body>
</html>
